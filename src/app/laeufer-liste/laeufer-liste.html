<p-panel header="Läufer Liste">
    <input type="file" class="file-input"
       [accept]="requiredFileType"
       (change)="onFileSelected($event)" #fileUpload>
    <button pButton (click)="fileUpload.click()">Import</button>
    	<p-orderlist [value]="laeuferListe()" dataKey="startnummer" [responsive]="true" breakpoint="575px">
            <ng-template #item let-option>
                <app-lauefer-option [option]="option" />
            </ng-template>
        </p-orderlist>
</p-panel>
