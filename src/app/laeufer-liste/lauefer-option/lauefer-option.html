<div class="flex justify-content-evenly align-items-baseline w-max">
    <div class="flex align-items-center justify-content-center m-2"><qrcode [qrdata]="qrData()" [width]="50" [errorCorrectionLevel]="'M'" #qrCode /></div>
    <div class="flex align-items-center justify-content-center m-2">{{ option?.startnummer }}</div>
    <div class="flex align-items-center justify-content-center border-round m-2">{{ option?.name }}</div>
    <div class="flex align-items-center justify-content-center m-2"><p-button (click)="save()" icon="pi pi-save" severity="secondary" [text]="true" /></div>
</div>
